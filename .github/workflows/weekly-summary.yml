name: Weekly Disaster Summary

on:
  schedule:
    # Runs every Monday at 3:00 AM UTC (adjust as needed)
    - cron: '0 3 * * 1'
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  generate-summary:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install anthropic
      
      - name: Generate disaster summary
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python disaster_summary.py
      
      - name: Commit and push summary
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add summaries/
          git diff --quiet && git diff --staged --quiet || git commit -m "Add weekly disaster summary - $(date +'%Y-%m-%d')"
          git push
